name: Build HENO for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate Python source
        run: python -m compileall app.py heno
      - name: Test Windows DPAPI token storage
        shell: pwsh
        run: |
          python -c "from heno.auth_chatgpt import _dpapi_protect,_dpapi_unprotect,_as_text; data=(b'HENO-test-token-'*1000); enc=_dpapi_protect(data); assert enc != data; assert _dpapi_unprotect(enc) == data; assert _as_text(b'abc') == 'abc'; print('OAuth storage/type tests OK')"
      - name: Test streamed AI bytes parsing
        shell: pwsh
        run: |
          python -c "from heno.ai import _line_to_text; assert _line_to_text(b'data: test').startswith('data:'); assert _line_to_text('data: test') == 'data: test'; print('AI stream bytes/text test OK')"
      - name: Test bilingual settings
        shell: pwsh
        run: |
          python -c "from heno.config import Settings; s=Settings(); assert s.language in {'auto','fr','en'}; print('Bilingual settings OK')"
      - name: Test Q&A archive
        shell: pwsh
        run: |
          python -c "import tempfile; from pathlib import Path; from heno.archive import QAArchive; p=Path(tempfile.gettempdir())/'heno-qa-test.jsonl'; p.unlink(missing_ok=True); a=QAArchive(p); a.append(meeting_id='m1',meeting_title='Test',question='Question?',answer='Answer.',language='en'); r=a.list_records(); assert r and r[-1]['question']=='Question?' and r[-1]['answer']=='Answer.'; p.unlink(missing_ok=True); print('Q&A archive OK')"
      - name: Test OpenAI JWKS access
        shell: pwsh
        run: |
          python -c "import requests; from heno.auth_chatgpt import JWKS_URL; r=requests.get(JWKS_URL,timeout=20); r.raise_for_status(); j=r.json(); assert j.get('keys'); print('OpenAI JWKS OK')"
      - name: Build
        run: pyinstaller HENO.spec --noconfirm --clean
      - name: Zip application
        shell: pwsh
        run: Compress-Archive -Path dist/HENO-Meeting-Assistant/* -DestinationPath HENO-Meeting-Assistant-Windows.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HENO-Meeting-Assistant-Windows
          path: HENO-Meeting-Assistant-Windows.zip
      - name: Publish or update v0.2.0 Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view v0.2.0 2>$null) {
            gh release upload v0.2.0 HENO-Meeting-Assistant-Windows.zip --clobber
          } else {
            gh release create v0.2.0 HENO-Meeting-Assistant-Windows.zip --target main --title "HENO v0.2.0" --notes "Nouvelle interface carnet/livre, transcription Français-English-Auto, archive permanente des questions et réponses HENO, et compte rendu structuré par thématiques, hypothèses, questions, décisions et actions."
          }
      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} HENO-Meeting-Assistant-Windows.zip --generate-notes --title "HENO ${{ github.ref_name }}"
