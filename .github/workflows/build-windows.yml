name: Build HENO for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate Python source
        run: python -m compileall app.py heno
      - name: Build
        run: pyinstaller HENO.spec --noconfirm --clean
      - name: Zip application
        shell: pwsh
        run: Compress-Archive -Path dist/HENO-Meeting-Assistant/* -DestinationPath HENO-Meeting-Assistant-Windows.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HENO-Meeting-Assistant-Windows
          path: HENO-Meeting-Assistant-Windows.zip
      - name: Publish or update v0.1.0 Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view v0.1.0 2>$null) {
            gh release upload v0.1.0 HENO-Meeting-Assistant-Windows.zip --clobber
          } else {
            gh release create v0.1.0 HENO-Meeting-Assistant-Windows.zip --target main --title "HENO v0.1.0" --notes "Première version Windows de HENO — Meeting Assistant."
          }
      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} HENO-Meeting-Assistant-Windows.zip --generate-notes --title "HENO ${{ github.ref_name }}"
